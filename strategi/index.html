<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strategi">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E0D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>Ruang Strategi Veon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: satu kolom tenang. Pertanyaan → angka vital → konstraint → taruhan → keputusan → eksperimen → persimpangan → insight */
:root{
  --bg:#F4F5F2;--surface:#FFFFFF;--fg:#111311;--muted:#3E4440;--line:#D8DBD5;
  --gold:#8F6B14;--gold-soft:#F1E8D2;--mint:#16765D;--mint-soft:#DDEFE8;
  --amber:#9A5B00;--amber-soft:#FBEBD3;--crit:#B3261E;--crit-soft:#F7E2DF;
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E0D;--surface:#141715;--fg:#F2F1EC;--muted:#B6BCB6;--line:#272B28;
  --gold:#DBB058;--gold-soft:#2A2416;--mint:#5FD3B0;--mint-soft:#12291F;
  --amber:#F2B45A;--amber-soft:#2B210F;--crit:#FF8A80;--crit-soft:#2C1614;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E0D;--surface:#141715;--fg:#F2F1EC;--muted:#B6BCB6;--line:#272B28;
  --gold:#DBB058;--gold-soft:#2A2416;--mint:#5FD3B0;--mint-soft:#12291F;
  --amber:#F2B45A;--amber-soft:#2B210F;--crit:#FF8A80;--crit-soft:#2C1614;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;padding-block:36px 72px;display:flex;flex-direction:column;gap:60px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(21px,3.8vw,27px);font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lede{color:var(--muted);max-width:64ch}
section{display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:6px}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{transform:translateY(10px);opacity:.3}}
@keyframes grow{from{width:0}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:28px;align-items:center}
.hero h1{font-size:clamp(28px,5.6vw,46px);line-height:1.08;font-weight:700}
.hero .thesis{color:var(--muted);font-size:16px;max-width:60ch;margin-top:14px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
.meta .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 2.6s infinite}
@keyframes blink{50%{opacity:.25}}
.gauge{position:relative;width:200px;height:200px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{fill:none;stroke:var(--line);stroke-width:10}
.gauge .proj{fill:none;stroke:var(--gold-soft);stroke-width:10}
.gauge .val{fill:none;stroke:var(--fg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.8s cubic-bezier(.3,.8,.2,1)}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.gauge .big{font-family:var(--f-mono);font-size:30px;font-weight:600}
.gauge .sm{font-size:11.5px;color:var(--muted);max-width:130px;line-height:1.35}

/* CHANGES */
.changes{border-left:2px solid var(--gold);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.changes li{list-style:none;font-size:14px}
.changes ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

/* VITALS */
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.vital{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;overflow:hidden}
.vital::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line)}
.vital.g::before{background:var(--mint)}.vital.a::before{background:var(--amber)}.vital.r::before{background:var(--crit)}
.vital .k{font-size:12px;color:var(--muted)}
.vital .v{font-family:var(--f-mono);font-size:23px;font-weight:600}
.vital.r .v{color:var(--crit)}
.vital .s{font-size:12px;color:var(--muted)}
.spark{width:100%;height:34px;margin-top:4px}
.spark path.l{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.6s .4s ease forwards}
.spark path.a{fill:var(--fg);opacity:.06}
.spark circle{fill:var(--fg)}
.vital.r .spark path.l,.vital.r .spark circle{stroke:var(--crit);fill:var(--crit)}
.vital.r .spark path.l{fill:none}
@keyframes draw{to{stroke-dashoffset:0}}

/* CHAIN */
.chain{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-top:6px}
.chain .wire{position:absolute;left:10%;right:10%;top:30px;height:2px;background:var(--line);overflow:hidden}
.chain .wire i{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:flow 3.2s linear infinite}
.chain .wire i:nth-child(2){animation-delay:1.06s}.chain .wire i:nth-child(3){animation-delay:2.13s}
@keyframes flow{from{left:-6px}to{left:100%}}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1;min-width:0}
.node:focus-visible .ring{outline:2px solid var(--gold);outline-offset:3px}
.node .ring{width:50px;height:50px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;transition:transform .3s}
.node.g .ring{border-color:var(--mint)}.node.a .ring{border-color:var(--amber)}
.node.r .ring{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);animation:pinch 2.2s infinite}
@keyframes pinch{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 40%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node .nl{font-size:13px;font-weight:600;line-height:1.25}
.node .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--crit)}
.node[aria-pressed="true"] .ring{transform:scale(1.12)}
.ndetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 24px}
.ndetail .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.ndetail .full{grid-column:1/-1}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.swap{animation:swap .4s ease backwards}
@keyframes swap{from{opacity:.25;transform:translateY(4px)}}

/* BETS */
.bets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.bet{border-bottom:1px solid var(--line)}
.bet>button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr) auto 130px 20px;gap:14px;align-items:center;width:100%;padding:16px 4px;box-sizing:border-box}
.bet>button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.rank{font-family:var(--f-mono);color:var(--gold);font-weight:600}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl span{font-size:13px;color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.jalan{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
.chip.uji{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.chip.parkir{text-decoration:line-through}
.score{display:flex;align-items:center;gap:10px}
.sb{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.sb i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:6px;animation:grow 1.2s cubic-bezier(.3,.8,.2,1) backwards}
.score .n{font-family:var(--f-mono);font-weight:600;width:26px;text-align:right}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .35s}
.bet[data-open="1"] .chev{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.8,.2,1)}
.bet[data-open="1"] .det{grid-template-rows:1fr}
.det>div{overflow:hidden}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding:0 4px 20px 44px}
.dgrid .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.dgrid .full{grid-column:1/-1}
.dgrid p{font-size:14px}

/* DECISIONS */
.decs{display:flex;flex-direction:column;gap:10px}
.dec{display:grid;grid-template-columns:78px minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.cd{display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--line);padding-right:14px}
.cd .d{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1}
.cd .u{font-size:11px;color:var(--muted);text-align:center}
.dec.late .cd .d{color:var(--crit)}
.dec.soon .cd .d{color:var(--amber)}
.dec .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.dec .rec{font-size:14px}
.dec .if{font-size:13px;color:var(--muted)}

/* EXPERIMENTS */
.exps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.exp{display:flex;flex-direction:column;gap:8px;min-width:0;border-top:2px solid var(--fg);padding-top:12px}
.exp.selesai{border-top-color:var(--line)}
.exp p{font-size:13.5px;color:var(--muted)}
.exp .res{color:var(--fg);font-size:14px}

/* FORK */
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;align-self:flex-start;position:relative}
.toggle button{all:unset;cursor:pointer;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;position:relative;z-index:1;transition:color .3s}
.toggle button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.toggle .pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--fg);transition:transform .4s cubic-bezier(.3,.8,.2,1),width .4s}
.toggle button[aria-pressed="true"]{color:var(--bg)}
.path{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.path .ceil{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--gold)}
.path ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.lean{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--gold-soft)}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--gold);padding-left:12px}

/* INSIGHTS + LISTS */
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px}
.feed{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;font-size:14px}
.feed .dd{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.feed .src{display:block;font-size:12px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;font-size:14px}
.checks li::before{content:"";flex:0 0 14px;height:14px;margin-top:3px;border:1.5px solid var(--gold);border-radius:4px}
.tomb{display:flex;flex-wrap:wrap;gap:8px}
.tomb span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--crit)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

.empty{padding:60px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty .bar{width:180px;height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.empty .bar i{position:absolute;inset:0;width:40%;background:var(--gold);animation:load 1.4s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

@media (max-width:680px){
  .hero{grid-template-columns:1fr}.gauge{width:170px;height:170px}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .exps,.two,.path,.ndetail{grid-template-columns:1fr}
  .bet>button{grid-template-columns:22px minmax(0,1fr) 20px}
  .bet .chip{grid-column:2;grid-row:2;justify-self:start}
  .bet .score{grid-column:2;grid-row:3}
  .bet .chev{grid-column:3;grid-row:1}
  .dgrid{grid-template-columns:1fr;padding-left:36px}
  .node .ring{width:42px;height:42px;font-size:12px}.chain .wire{top:26px}
  .node .nl{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.spark path.l{stroke-dashoffset:0}}
</style><style>
html{background:var(--bg)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.lockf{display:flex;gap:8px;width:100%;max-width:320px}
.lockf[hidden]{display:none}
.lockf input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--surface);color:var(--fg)}
.lockf button{padding:12px 16px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:600}
.refresh{all:unset;cursor:pointer;margin-left:4px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.refresh:active{transform:scale(.96)}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="empty">
    <div class="eyebrow">Ruang Strategi VEON</div>
    <h2>Memuat peta strategi…</h2>
    <p class="lede" id="emptyMsg">Halaman ini menampilkan pertanyaan strategis minggu ini, angka vital, konstraint, taruhan pendongkrak omset, dan keputusan yang menunggu. Isinya diperbarui otomatis tiap jam 01.00 WIB.</p>
    <div class="bar"><i></i></div>
    <form id="lockf" class="lockf" hidden><input id="kode" type="password" autocomplete="current-password" placeholder="Kode Kompas"><button>Buka</button></form>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chev='<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const daysTo=d=>{if(!d)return null;const t=new Date(d+"T00:00:00+07:00"),n=new Date();return Math.ceil((t-n)/864e5)};
let S=null,fork="A",node=null;

function spark(trend){
  if(!trend||trend.length<2)return"";
  const w=120,h=34,p=4,mn=Math.min(...trend),mx=Math.max(...trend),r=mx-mn||1;
  const pts=trend.map((v,i)=>[p+i*(w-2*p)/(trend.length-1),h-p-(v-mn)/r*(h-2*p)]);
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d} L${last[0]} ${h} L${pts[0][0]} ${h} Z"/><path class="l" d="${d}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6"/></svg>`;
}

function render(){
  const s=S,n=s.north||{},C=2*Math.PI*84;
  const pct=Math.min(1,(n.runRate||0)/(n.target||1));
  const pj=n.projection||[];
  const projLen=pj.length?Math.min(1,pj[1]/n.target)*C:0;
  const chain=s.chain||{nodes:[]};
  if(!node)node=chain.constraint||(chain.nodes[0]||{}).id;
  $("#app").innerHTML=`
  <section class="hero rise">
    <div>
      <div class="eyebrow">Pertanyaan minggu ini</div>
      <h1>${esc(s.question)}</h1>
      <p class="thesis">${esc(s.thesis)}</p>
      <div class="meta"><span class="dot"></span>Diperbarui ${esc(s.meta?.updatedLabel||s.meta?.updatedAt)} · update otomatis tiap 01.00 WIB <button id="refresh" class="refresh" aria-label="Muat ulang">↻ Muat ulang</button></div>
    </div>
    <div class="gauge" aria-label="Run rate ${esc(n.runRate)} juta per hari dari target ${esc(n.target)} juta">
      <svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="84"/>
        <circle class="proj" cx="100" cy="100" r="84" stroke-dasharray="${projLen} ${C}"/>
        <circle class="val" id="gv" cx="100" cy="100" r="84" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
      <div class="ctr"><span class="big">${esc(n.runRate)}</span><span class="sm">dari Rp ${esc(n.target)} jt/hari<br>${esc(n.label||"")}</span></div>
    </div>
  </section>

  ${s.changes?.length?`<section class="changes"><div class="eyebrow">Yang berubah</div><ul>${s.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></section>`:""}

  <section>
    <div class="head"><div class="eyebrow">Angka vital</div><h2>Empat angka yang menentukan langkah berikutnya</h2></div>
    <div class="vitals">${(s.vitals||[]).map(v=>`<div class="vital ${esc(v.status)}"><span class="k">${esc(v.label)}</span><span class="v">${esc(v.value)}</span><span class="s">${esc(v.sub)}</span>${spark(v.trend)}</div>`).join("")}</div>
  </section>

  <section>
    <div class="head"><div class="eyebrow">Bottleneck · Theory of Constraints</div><h2>Di mana aliran omset tersumbat</h2>
      <p class="lede">Rantai dari permintaan sampai orang. Satu titik merah adalah konstraint saat ini: memperbaiki titik lain sebelum yang merah tidak menaikkan omset. Ketuk titik untuk detailnya.</p></div>
    <div class="chain"><div class="wire"><i></i><i></i><i></i></div>
      ${chain.nodes.map((x,i)=>`<button class="node ${esc(x.status)}" data-id="${esc(x.id)}" aria-pressed="${x.id===node}"><span class="ring">${i+1}</span><span class="nl">${esc(x.label)}</span>${x.id===chain.constraint?'<span class="tag">konstraint</span>':x.id===chain.next?'<span class="tag" style="color:var(--amber)">berikutnya</span>':""}</button>`).join("")}
    </div>
    <div class="card"><div class="ndetail swap" id="nd"></div></div>
  </section>

  <section>
    <div class="head"><div class="eyebrow">Taruhan strategi</div><h2>Ide pendongkrak omset, diurutkan dari skor tertinggi</h2>
      <p class="lede">Skor 0–100 menimbang dampak ke omset, kekuatan bukti, biaya mencoba, dan apakah ia melonggarkan konstraint. Ketuk untuk bukti, langkah berikutnya, dan batas berhenti.</p></div>
    <div class="bets">${(s.bets||[]).map((b,i)=>`
      <div class="bet" data-open="${i===0?1:0}"><button aria-expanded="${i===0}">
        <span class="rank">${i+1}</span><span class="ttl"><h3>${esc(b.title)}</h3><span>${esc(b.sub)}</span></span>
        <span class="chip ${esc(b.status)}">${esc(b.status)}</span>
        <span class="score"><span class="sb"><i style="width:${+b.score||0}%;animation-delay:${.12*i+.2}s"></i></span><span class="n">${esc(b.score)}</span></span>${chev}</button>
        <div class="det"><div><div class="dgrid">
          <div class="f full"><span class="lbl">Bukti</span><p>${esc(b.evidence)}</p></div>
          <div class="f full"><span class="lbl">Langkah berikutnya</span><p>${esc(b.next)}</p></div>
          <div class="f"><span class="lbl">Pemilik</span><p>${esc(b.owner)}</p></div>
          <div class="f"><span class="lbl">Ukuran berhasil</span><p>${esc(b.metric)}</p></div>
          ${b.stop?`<div class="f full"><span class="lbl">Berhenti kalau</span><p>${esc(b.stop)}</p></div>`:""}
        </div></div></div></div>`).join("")}</div>
  </section>

  <section>
    <div class="head"><div class="eyebrow">Keputusan menunggu</div><h2>Yang harus diputuskan, dan kapan</h2></div>
    <div class="decs">${(s.decisions||[]).map(d=>{const k=daysTo(d.due);const cls=k===null?"late":k<=3?"soon":"";
      return `<div class="dec ${d.due?cls:"late"}"><div class="cd"><span class="d">${k===null?"!":k<0?"lewat":k}</span><span class="u">${k===null?esc(d.dueLabel||"tertunda"):k<0?esc(d.dueLabel):"hari · "+esc(d.dueLabel)}</span></div>
        <div class="body"><h3>${esc(d.title)}</h3><p class="rec"><b>Saran:</b> ${esc(d.rec)}</p>${d.ifLate?`<p class="if">Kalau ditunda: ${esc(d.ifLate)}</p>`:""}</div></div>`}).join("")}</div>
  </section>

  <section>
    <div class="head"><div class="eyebrow">Eksperimen</div><h2>Apa yang sedang diuji dan apa hasilnya</h2></div>
    <div class="exps">${(s.experiments||[]).map(e=>`<div class="exp ${esc(e.status)}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>${esc(e.name)}</h3><span class="chip ${e.status==="jalan"?"jalan":""}">${esc(e.status)}</span></div><p>${esc(e.hypothesis)}</p><p class="res">${esc(e.result)}</p><p>Ukuran: ${esc(e.metric)}</p></div>`).join("")}</div>
  </section>

  ${s.fork?`<section>
    <div class="head"><div class="eyebrow">Persimpangan</div><h2>${esc(s.fork.question||"VEON mau jadi apa?")}</h2></div>
    <div class="toggle" role="group" aria-label="Pilih jalan"><span class="pill" id="pill"></span><button id="bA" aria-pressed="${fork==="A"}">Jalan A</button><button id="bB" aria-pressed="${fork==="B"}">Jalan B</button></div>
    <div class="card"><div class="path swap" id="path"></div></div>
  </section>`:""}

  <section class="two">
    <div class="head" style="gap:14px"><div class="eyebrow">Insight terbaru dari Kompas</div><ul class="feed">${(s.insights||[]).map(x=>`<li><span class="dd">${esc(x.d)}</span><span>${esc(x.t)}<span class="src">${esc(x.src)}</span></span></li>`).join("")}</ul></div>
    <div style="display:flex;flex-direction:column;gap:28px">
      <div class="head" style="gap:12px"><div class="eyebrow">Data yang perlu masuk</div><ul class="checks">${(s.questions||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
      <div class="head" style="gap:12px"><div class="eyebrow">Sudah dikubur</div><div class="tomb">${(s.buried||[]).map(b=>`<span>${esc(b)}</span>`).join("")}</div></div>
    </div>
  </section>

  <footer>${esc(s.meta?.sources||"")}</footer>`;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$("#gv");if(g)g.style.strokeDashoffset=C*(1-pct)}));
  showNode();
  document.querySelectorAll(".node").forEach(b=>b.onclick=()=>{node=b.dataset.id;document.querySelectorAll(".node").forEach(x=>x.setAttribute("aria-pressed",x===b));showNode()});
  document.querySelectorAll(".bet>button").forEach(b=>b.onclick=()=>{const el=b.parentElement,o=el.dataset.open==="1";el.dataset.open=o?0:1;b.setAttribute("aria-expanded",!o)});
  if(s.fork){$("#bA").onclick=()=>showFork("A");$("#bB").onclick=()=>showFork("B");showFork(fork)}
}
function showNode(){
  const c=S.chain||{},x=(c.nodes||[]).find(n=>n.id===node);if(!x)return;
  const el=$("#nd");el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap");
  el.innerHTML=`<div class="f full"><span class="lbl">${esc(x.label)}${x.id===c.constraint?" · konstraint saat ini":""}</span><h3>${esc(x.headline)}</h3></div>
    <div class="f"><span class="lbl">Kenapa</span><p>${esc(x.why)}</p></div><div class="f"><span class="lbl">Langkah</span><p>${esc(x.move)}</p></div>`;
}
function showFork(k){
  fork=k;const p=S.fork[k];if(!p)return;
  const el=$("#path");el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap");
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="eyebrow">Jalan ${k}</div><h3 style="font-size:20px">${esc(p.name)}</h3><div><div class="ceil">${esc(p.ceil)}</div><div style="font-size:13px;color:var(--muted)">${esc(p.ceilSub)}</div></div>
    ${S.fork.lean===k?'<div class="lean">Kevin sedang condong ke jalan ini</div>':""}</div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0"><div><span class="lbl">Butuh</span><ul>${(p.need||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><span class="lbl">Cocok kalau</span><ul>${(p.fit||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
    ${S.fork.note?`<p class="note" style="grid-column:1/-1">${esc(S.fork.note)}</p>`:""}`;
  const bA=$("#bA"),bB=$("#bB"),on=k==="A"?bA:bB;bA.setAttribute("aria-pressed",k==="A");bB.setAttribute("aria-pressed",k==="B");
  const pill=$("#pill");pill.style.width=on.offsetWidth+"px";pill.style.transform=`translateX(${on.offsetLeft}px)`;
}
window.addEventListener("resize",()=>{if(S?.fork)showFork(fork)});


const KEY='kompas-kode';
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function store(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function load(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function ask(t){const m=$("#emptyMsg");m.textContent=t;$("#lockf").hidden=false;$("#kode").focus()}
async function openData(code){
  $("#lockf").hidden=true;$("#emptyMsg").textContent="Membuka Ruang Strategi…";
  let r=await fetch("data.enc.json",{cache:"no-cache"}).catch(()=>null);
  if(!r||!r.ok){ask("Data belum bisa dimuat. Cek koneksi lalu tarik ulang.");return}
  const d=await r.json();
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.salt),iterations:d.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.iv)},key,b64(d.ct));
    S=JSON.parse(new TextDecoder().decode(plain));
  }catch(e){store("");ask("Kode salah. Masukkan kode Kompas (kode yang sama dengan PWA Kompas).");return}
  render();
  if(document.fonts)document.fonts.ready.then(()=>{if(S.fork)showFork(fork)});
}
const hm=location.hash.match(/k=([^&]+)/);
if(hm){store(decodeURIComponent(hm[1]));history.replaceState(null,"",location.pathname+location.search)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("submit",e=>{if(e.target.id!=="lockf")return;e.preventDefault();const v=$("#kode").value.trim();if(!v)return;store(v);openData(v)});
document.addEventListener("click",e=>{if(e.target.closest("#refresh")){const c=load();if(c){S=null;openData(c)}}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S){const c=load();if(c)openData(c)}});
const c0=load();if(c0)openData(c0);else ask("Masukkan kode Kompas. Cukup sekali di HP ini.");
</script>
